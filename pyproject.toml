[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-img-renamer"
version = "1.0.0"
description = "AI-powered image renamer using Google Gemini"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ai-rename = "img_renamer:main"

[project.urls]
Homepage = "https://github.com/jacksloan/ai-img-renamer"
Repository = "https://github.com/jacksloan/ai-img-renamer.git"
Issues = "https://github.com/jacksloan/ai-img-renamer/issues"

[tool.setuptools]
py-modules = ["img_renamer"]
